# JSON Schema (in YAML) for jd-keywords.yaml
# Written by the keyword-agent (method: .claude/skills/jd-keywords/SKILL.md).
# Read by cv-agent, cl-agent, /revise, and scripts/validate_output.py, which
# checks that every must-have keyword the candidate has reaches the CV.

type: object
required: [role, keywords]
additionalProperties: false

properties:
  role:
    type: object
    required: [title, family, seniority, posting_language]
    additionalProperties: false
    properties:
      title:
        type: string
        description: "The job title exactly as the posting writes it, e.g. 'Medior Analytics Engineer'"
      family:
        type: string
        enum: [analytics-engineer, data-engineer, hybrid]
        description: "Which emphasis the CV takes: analytics engineer (modelling, dbt, BI, stakeholders), data engineer (pipelines, orchestration, scale, platform), or hybrid"
      seniority:
        type: string
        enum: [junior, medior, senior, lead, unspecified]
        description: "From the title, the years asked for and the scope; 'unspecified' when the posting gives no signal"
      years_required:
        type: string
        description: "Years of experience the posting asks for, as written (e.g. '4+ years'); omit if none"
      posting_language:
        type: string
        enum: [English, Dutch]
      dutch_required:
        type: string
        enum: ["yes", "nice", "no"]
        description: "Whether the posting asks for Dutch: required, a plus, or not mentioned"

  keywords:
    type: array
    minItems: 1
    description: "Ranked: rank 1 is the most important. Musts first, then nices."
    items:
      type: object
      required: [term, type, priority, rank, match]
      additionalProperties: false
      properties:
        term:
          type: string
          description: "The posting's exact wording (e.g. 'data pipelines', 'dbt', 'stakeholder management')"
        aliases:
          type: array
          items: { type: string }
          description: "Other spellings of the SAME thing (e.g. 'Google BigQuery' for 'BigQuery'). Not analogues."
        type:
          type: string
          enum: [tool, skill, responsibility, domain, soft-skill]
        priority:
          type: string
          enum: [must, nice]
        rank:
          type: integer
          minimum: 1
        match:
          type: string
          enum: ["yes", analogue, "no"]
          description: "yes = candidate.md shows it; analogue = candidate.md shows a close equivalent (named in use_as); no = a gap"
        use_as:
          type: string
          description: "For an analogue: the candidate's own tool or skill to write instead (e.g. 'Snowflake' for 'Redshift'). For yes: only if the candidate's wording differs; omit otherwise."
        evidence:
          type: string
          description: "Where candidate.md shows it: section and role, plus a short quote or metric. Required for yes and analogue."
        place:
          type: array
          items:
            type: string
            enum: [summary, skills, experience, projects, certifications, cover-letter]
          description: "Where the CV and letter should use it. Empty or omitted for a gap."
      allOf:
        - if:
            properties: { match: { enum: ["yes", analogue] } }
          then:
            required: [evidence]
        - if:
            properties: { match: { const: analogue } }
          then:
            required: [use_as]
