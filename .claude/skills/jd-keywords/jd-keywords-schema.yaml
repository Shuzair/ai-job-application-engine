# JSON Schema (in YAML) for jd-keywords.yaml
# Written by the keyword-agent from the posting alone (method:
# .claude/skills/jd-keywords/SKILL.md). It says what the employer asks for and
# nothing about the candidate; jd-to-profile.yaml maps each keyword to the
# candidate. Read by the mapper agents, cv-agent, cl-agent, /revise, and
# scripts/validate_output.py.

type: object
required: [role, keywords]
additionalProperties: false

properties:
  role:
    type: object
    required: [title, family, seniority, posting_language]
    additionalProperties: false
    properties:
      title:
        type: string
        description: "The job title exactly as the posting writes it, e.g. 'Medior Analytics Engineer'"
      family:
        type: string
        enum: [analytics-engineer, data-engineer, hybrid]
        description: "Which emphasis the CV takes: analytics engineer (modelling, dbt, BI, stakeholders), data engineer (pipelines, orchestration, scale, platform), or hybrid"
      seniority:
        type: string
        enum: [junior, medior, senior, lead, unspecified]
        description: "From the title, the years asked for and the scope; 'unspecified' when the posting gives no signal"
      years_required:
        type: string
        description: "Years of experience the posting asks for, as written (e.g. '4+ years'); omit if none"
      posting_language:
        type: string
        enum: [English, Dutch]
      dutch_required:
        type: string
        enum: ["yes", "nice", "no"]
        description: "Whether the posting asks for Dutch: required, a plus, or not mentioned"
      english_level:
        type: string
        description: "English level the posting asks for, as written (e.g. 'B2+'); omit if none"

  keywords:
    type: array
    minItems: 1
    description: "Ranked: rank 1 is the most important. Musts first, then nices."
    items:
      type: object
      required: [term, type, priority, rank]
      additionalProperties: false
      properties:
        term:
          type: string
          description: "The posting's exact wording (e.g. 'data pipelines', 'dbt', 'stakeholder management'). Unique within the file."
        aliases:
          type: array
          items: { type: string }
          description: "Other spellings of the SAME thing (e.g. 'Google BigQuery' for 'BigQuery'). Not alternatives."
        type:
          type: string
          enum: [tool, skill, responsibility, domain, soft-skill]
          description: "tool/skill terms are short names ('Airflow', 'data modelling'); longer phrases are responsibilities"
        priority:
          type: string
          enum: [must, nice]
        rank:
          type: integer
          minimum: 1
        context:
          type: string
          description: "Optional: the posting's sentence the keyword comes from, when the term alone loses meaning"
