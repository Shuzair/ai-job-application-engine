# JSON Schema (in YAML) for profile-to-jd.yaml — the profile → job mapping.
# Written by profile-to-jd-agent (method: .claude/skills/profile-mapping/SKILL.md).
# The candidate's achievements ranked by value to THIS job — including ones the
# posting does not name — plus what to leave out. Quotes are checked against
# candidate.md by validate_output.py.

type: object
required: [highlights]
additionalProperties: false

properties:
  highlights:
    type: array
    minItems: 1
    items:
      type: object
      required: [rank, title, strength, evidence, why, use_in]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
        title:
          type: string
          description: "Short name for the achievement, e.g. 'Commission system redesign (Afiniti)'"
        strength:
          type: string
          enum: [shipped, built, tooling, certified, learning, planned]
        evidence:
          type: array
          minItems: 1
          items:
            type: object
            required: [where, quote]
            additionalProperties: false
            properties:
              where: { type: string }
              quote: { type: string, minLength: 12 }
        why:
          type: string
          description: "Which need of this employer it answers — named in the posting or clearly implied by it"
        keywords:
          type: array
          items: { type: string }
          description: "jd-keywords.yaml terms it proves; empty when it answers an implied need"
        metric:
          type: string
          description: "The number that makes it concrete, as candidate.md states it"
        use_in:
          type: array
          minItems: 1
          items:
            type: string
            enum: [summary, experience, projects, cover-letter]

  leave_out:
    type: array
    items:
      type: object
      required: [item, reason]
      additionalProperties: false
      properties:
        item: { type: string }
        reason: { type: string }
