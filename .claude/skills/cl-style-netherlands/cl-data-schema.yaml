# JSON Schema (in YAML) for cl-data.yaml — Netherlands Style
# Validates structured cover letter data produced by the cl-agent.
# Each style has its own complete schema. No inheritance.

type: object
required: [header, date, salutation, paragraphs, sign_off]
additionalProperties: false

properties:
  header:
    type: object
    required: [name, email]
    additionalProperties: false
    properties:
      name:
        type: string
      title:
        type: string
        description: "Candidate's current/target role title for the header"
      email:
        type: string
        format: email
      phone:
        type: string
      linkedin:
        type: string
        description: "LinkedIn URL — required in Dutch applications; LinkedIn is the primary professional network in the Netherlands"
      github:
        type: string
      relocation:
        type: string
        description: "Optional relocation statement — e.g. 'Available to relocate to Amsterdam'. Never visa, sponsorship or work-permit status."

  date:
    type: string
    description: "Letter date, day first — e.g. '27 October 2026'. Use the `date` that prepare_folder.py returned."

  salutation:
    type: string
    description: "English: 'Dear Mr./Ms. [Surname],' / 'Dear Hiring Manager,' / 'Dear [Team] Team,' / 'Hi [First Name],' — match formality to company culture."

  paragraphs:
    type: array
    items: { type: string }
    minItems: 4
    maxItems: 5
    description: "4 paragraphs: (1) opening hook with specific company reference, (2) why I'm a good fit with quantified achievements, (3) why this company specifically, (4) close with call to action. Dutch letters are direct and concrete — no padding."

  sign_off:
    type: object
    required: [closing, name]
    additionalProperties: false
    properties:
      closing:
        type: string
        description: "'Kind regards,' (standard) / 'Yours sincerely,' (formal) / 'Best regards,' (warmer). Match the formality of the salutation."
      name:
        type: string
      title:
        type: string
      email:
        type: string
      phone:
        type: string
